name: Refresh suggestions

# Rebuilds src/data/suggestions.json from open issues labelled `tool-suggestion`
# and commits it if anything changed. Same shape as refresh-popular.yml, and for
# the same reason: the site build never calls the network, so the snapshot lives
# in git. See docs/suggestions.md.

on:
  schedule:
    # 05:20 UTC daily — after the analytics refresh, and off the hour because
    # everyone schedules on the hour and the shared runners queue accordingly.
    - cron: '20 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: refresh-suggestions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the open suggestions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-suggestions.mjs

      - name: Commit if the suggestions changed
        run: |
          if git diff --quiet -- src/data/suggestions.json; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/suggestions.json
          git commit -m "Refresh reader suggestions"
          git push

name: Refresh most-viewed snapshot

# Rebuilds src/data/popular.json from Cloudflare Web Analytics and commits it if
# the ranking changed. The site build never calls this API itself — see
# docs/analytics.md for why the snapshot lives in git.

on:
  schedule:
    # 04:15 UTC daily. Off the hour, because everyone schedules on the hour and
    # GitHub's shared runners queue accordingly.
    - cron: '15 4 * * *'
  workflow_dispatch: # so you can trigger the first run by hand

permissions:
  contents: write

concurrency:
  group: refresh-popular
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    # The CF_* secrets live on this environment, not on the repository. Without
    # this line the job runs with them unset and fails on the first check.
    environment: Devtool Analytics

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the ranking
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_SITE_TAG: ${{ secrets.CF_SITE_TAG }}
        run: node scripts/fetch-popular.mjs

      - name: Commit if the ranking changed
        run: |
          if git diff --quiet -- src/data/popular.json; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/popular.json
          git commit -m "Refresh most-viewed snapshot"
          git push
